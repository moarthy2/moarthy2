name: Verify Empty Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe empty index
        run: |
          index_code=000
          empty=no
          for attempt in $(seq 1 18); do
            index_code=$(curl -sS -L --max-time 15 -o /tmp/index.json -w '%{http_code}' https://moarthy2.github.io/moarthy2/index.json || true)
            if [ "$index_code" = 200 ]; then
              empty=$(python3 -c "import json; d=json.load(open('/tmp/index.json')); print('yes' if d.get('version') == 1 and not d.get('uuids') and not d.get('names') else 'no')" 2>/dev/null || echo no)
              if [ "$empty" = yes ]; then break; fi
            fi
            sleep 10
          done
          {
            echo "index_http=$index_code"
            echo "index_empty=$empty"
            echo "index_body=$(head -c 500 /tmp/index.json 2>/dev/null | tr '\n' ' ')"
            echo "cors=$(curl -sS -L -D - -o /dev/null --max-time 15 https://moarthy2.github.io/moarthy2/index.json 2>/dev/null | grep -i '^access-control-allow-origin:' | tr -d '\r' || true)"
          } > pages-empty-check.txt
          cat pages-empty-check.txt
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-empty-check.txt
          git diff --cached --quiet || git commit -m "Record empty Pages probe [skip ci]"
          git push
