name: Verify Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe Pages
        run: |
          index_code=000
          cape_code=000
          for attempt in $(seq 1 18); do
            index_code=$(curl -sS -L --max-time 15 -o /tmp/index.json -w '%{http_code}' https://moarthy2.github.io/moarthy2/index.json || true)
            cape_code=$(curl -sS -L --max-time 15 -o /tmp/cape.png -w '%{http_code}' https://moarthy2.github.io/moarthy2/capes/9e50bf9bebda3052.png || true)
            if [ "$index_code" = 200 ] && [ "$cape_code" = 200 ]; then break; fi
            sleep 10
          done
          {
            echo "index_http=$index_code"
            echo "cape_http=$cape_code"
            echo "index_body=$(head -c 500 /tmp/index.json 2>/dev/null | tr '\n' ' ')"
            echo "cape_sha256=$(sha256sum /tmp/cape.png 2>/dev/null | cut -d' ' -f1)"
            echo "index_cors=$(curl -sS -L -D - -o /dev/null --max-time 15 https://moarthy2.github.io/moarthy2/index.json 2>/dev/null | grep -i '^access-control-allow-origin:' | tr -d '\r' || true)"
          } > pages-check.txt
          cat pages-check.txt
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-check.txt
          git diff --cached --quiet || git commit -m "Record Pages probe [skip ci]"
          git push
