name: Build capes

on:
  push:
    branches: [main]
    paths:
      - "uploads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-capes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image library
        run: python -m pip install --disable-pip-version-check "pillow>=11,<13"

      - name: Test index builder
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Build index
        run: python tools/build_index.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build capes [skip ci]"
          git push
